<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota dos Trens - Red Rush</title>
    <link rel="stylesheet" href="../assets/style/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <nav class="nave">
            <img class="logo" src="../assets/imag/Logo_red_rush.png" alt="Red Rush Logo">
            <h1 id="hs">Red Rush</h1>
            <a id="lk" href="home.html">Voltar</a>
        </nav>
        <nav class="navs">
            <button class="botao"><a id="lk" href="rotatrem.html">Rota dos trens</a></button>
            <button class="botao"><a id="lk" href="horatrem.html">Horários</a></button>
            <button class="botao"><a id="lk" href="trens.html">Ver trens</a></button>
        </nav>
    </header>

    <main>
        <div class="adn">
            <div class="senso">
                <h1>Rota dos Trens</h1>
                <br>
                <label id="back" for="tremSelect">Selecione um trem:</label>
                <br>
                <select id="tremSelect" class="sec">
                    <option value="">-- Escolha um trem --</option>
                    <option value="trem1">Trem 1 - Linha Norte</option>
                    <option value="trem2">Trem 2 - Linha Sul</option>
                    <option value="trem3">Trem 3 - Linha Leste</option>
                </select>
                <br><br>
                <div id="rotaContainer" style="display:none;">
                    <h4>Rota do trem selecionado</h4>
                    <img id="rotaImg" src="" alt="Rota do trem" style="max-width:600px; width:100%; border-radius:10px;">
                </div>
            </div>
        </div>
    </main>

    <footer>

    </footer>

    <script>
        const rotas = {
            trem1: "../assets/imag/rota_trem1.png",
            trem2: "../assets/imag/rota_trem2.png",
            trem3: "../assets/imag/rota_trem3.png"
        };

        const select = document.getElementById("tremSelect");
        const container = document.getElementById("rotaContainer");
        const img = document.getElementById("rotaImg");

        select.addEventListener("change", function () {
            const rota = rotas[this.value];
            if (rota) {
                img.src = rota;
                container.style.display = "block";
            } else {
                container.style.display = "none";
            }
        });
    </script>
</body>

</html>
